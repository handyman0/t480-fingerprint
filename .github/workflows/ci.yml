name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The installer: formatting, strict lints and unit tests. No dependencies to download.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: fmt, clippy, tests
        working-directory: installer
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  # Everything that does not need the sensor, in a clean Debian 13: build the installer, run the
  # doctor, then fetch libfprint, apply the patch, compile it and run its own test suite.
  debian:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test in Debian 13
        run: docker run --rm -v "$PWD:/src:ro" debian:13 bash /src/scripts/ci-debian.sh /src
